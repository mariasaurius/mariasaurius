name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 3 * * *" # todos los días a las 3am UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: mariasaurius
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF6B9D&color_dots=FFF3F8,FFD6E8,FFC1D9,D4C1F5,A8D4F5

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
